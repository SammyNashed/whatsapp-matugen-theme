<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; background: #12141c; color: #e6e6ef; font: 13px/1.4 system-ui, sans-serif; }
  main { padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #6c7bff; color: #fff; font: inherit; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  .ghost { margin-top: 8px; background: #262a3b; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li { padding: 4px 0; }
  .ok { color: #7ddc9a; } .bad { color: #ff8a80; } .dim { color: #8b8fa3; }
</style>
<main>
  <h1>WhatsApp Matugen Theme</h1>
  <button id="go">Check now</button>
  <button id="pick" class="ghost">Choose wallpaper</button>
  <ul id="out"></ul>
</main>
<script src="popup.js"></script>
